# compose 内部専用の転送プロキシ。ホストは公開しない（compose.yml で ports を設定しない）。
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 20
LogLevel Notice
DisableViaHeader Yes

# allowed-hosts に一致するホストだけを中継し、それ以外は拒否する
Filter "/etc/tinyproxy/allowed-hosts"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive Off

# 内部のフィードは http のみ。CONNECT（https のトンネル）は使わない
ConnectPort 0
