name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/x-webhook-rss
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  theme:
    # テーマの色の組み合わせが WCAG 2.2 AA のコントラスト比を満たすこと
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "themes/**/*.test.js"

  theme-e2e:
    # 実際の Miniflux に apply-theme.sh でテーマを適用し、API で反映を確認する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env (Miniflux + PostgreSQL only)
        run: |
          cp .env.example .env
          sed -i -e 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=/' \
                 -e 's/^READER_HOSTNAME=.*/READER_HOSTNAME=localhost/' \
                 -e 's/^CLOUDFLARE_TUNNEL_TOKEN=CHANGE_ME$/CLOUDFLARE_TUNNEL_TOKEN=unused/' .env
          bash scripts/init.sh
      - run: docker compose up -d --wait postgres miniflux
      - name: Apply and verify via API
        shell: bash
        run: |
          set -euo pipefail
          set -a; source .env; set +a
          admin_pw="$ADMIN_PASSWORD"
          me() { curl -fsS -u "${ADMIN_USERNAME}:${admin_pw}" http://127.0.0.1:8080/v1/me; }
          check() { me | python3 -c "import json,sys; u=json.load(sys.stdin); css=open('themes/dads/miniflux.css',encoding='utf-8').read(); assert $1, {k: (v[:80] if isinstance(v, str) else v) for k, v in u.items() if k in ('theme','stylesheet','external_font_hosts','language','timezone')}"; }
          setenv() { grep -q "^$1=" .env || { echo "missing $1 in .env"; exit 1; }; sed -i "s|^$1=.*|$1=$2|" .env; }
          language_before="$(me | python3 -c 'import json,sys; print(json.load(sys.stdin)["language"])')"

          echo "--- dads (basic auth)"
          bash scripts/apply-theme.sh
          check 'u["theme"]=="system_sans_serif" and u["stylesheet"].strip()==css.strip()'
          check "u['language']=='${language_before}'"
          test -f .state/theme-before-dads.json
          bash scripts/apply-theme.sh   # 冪等
          check 'u["stylesheet"].strip()==css.strip()'

          echo "--- web font"
          setenv MINIFLUX_THEME_WEB_FONT true
          bash scripts/apply-theme.sh
          check 'u["stylesheet"].startswith("@import") and u["stylesheet"].rstrip().endswith(css.rstrip()[-40:]) and u["external_font_hosts"]=="fonts.googleapis.com fonts.gstatic.com" and u["theme"]=="system_sans_serif"'
          setenv MINIFLUX_THEME_WEB_FONT false
          bash scripts/apply-theme.sh
          check 'not u["stylesheet"].startswith("@import")'

          echo "--- API key auth (password intentionally wrong)"
          token="$(openssl rand -hex 24)"
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U miniflux -d miniflux \
            -c "INSERT INTO api_keys (user_id, token, description) SELECT id, '${token}', 'ci' FROM users WHERE username = '${ADMIN_USERNAME}';"
          setenv MINIFLUX_API_KEY "$token"
          setenv ADMIN_PASSWORD wrong-password
          bash scripts/apply-theme.sh
          check 'u["stylesheet"].strip()==css.strip()'

          echo "--- error paths"
          setenv MINIFLUX_API_KEY invalid-token
          if bash scripts/apply-theme.sh; then echo "expected failure with invalid API key"; exit 1; fi
          test -f .state/theme.failed
          setenv MINIFLUX_API_KEY "$token"
          setenv MINIFLUX_THEME foo
          if bash scripts/apply-theme.sh; then echo "expected failure with unknown theme"; exit 1; fi
          setenv MINIFLUX_THEME dads
          bash scripts/apply-theme.sh
          test ! -f .state/theme.failed

          echo "--- none does not touch user settings"
          curl -fsS -X PUT -H "X-Auth-Token: ${token}" -H 'Content-Type: application/json' \
            --data '{"stylesheet": "/* user css */", "theme": "dark_serif"}' \
            "http://127.0.0.1:8080/v1/users/$(me | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')" >/dev/null
          setenv MINIFLUX_THEME none
          bash scripts/apply-theme.sh
          check 'u["stylesheet"]=="/* user css */" and u["theme"]=="dark_serif"'

          echo "--- reset restores the settings before dads"
          setenv MINIFLUX_THEME dads
          bash scripts/apply-theme.sh --reset
          check 'u["stylesheet"]=="" and u["theme"]=="light_serif"'
          test ! -f .state/theme-before-dads.json

          echo "--- reset without dads applied does not touch user settings"
          curl -fsS -X PUT -H "X-Auth-Token: ${token}" -H 'Content-Type: application/json' \
            --data '{"stylesheet": "/* user css 2 */", "theme": "dark_sans_serif"}' \
            "http://127.0.0.1:8080/v1/users/$(me | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')" >/dev/null
          bash scripts/apply-theme.sh --reset
          check 'u["stylesheet"]=="/* user css 2 */" and u["theme"]=="dark_sans_serif"'

          echo "--- re-apply for the browser checks"
          setenv ADMIN_PASSWORD "$admin_pw"
          bash scripts/apply-theme.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Browser checks (Playwright)
        shell: bash
        working-directory: themes/dads/test
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          set -a; source ../../../.env; set +a
          MINIFLUX_URL=http://localhost:8080 node browser.e2e.mjs
      - if: failure()
        run: |
          docker compose ps -a
          docker compose logs postgres miniflux

  fetch-proxy-e2e:
    # 内部のフィードは fetch-proxy 経由でだけ取得でき、直接接続や許可していないホストは拒否されること
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env (Miniflux + PostgreSQL + x-webhook-rss)
        run: |
          cp .env.example .env
          sed -i -e 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=x/' \
                 -e 's/^READER_HOSTNAME=.*/READER_HOSTNAME=localhost/' \
                 -e 's/^CLOUDFLARE_TUNNEL_TOKEN=CHANGE_ME$/CLOUDFLARE_TUNNEL_TOKEN=unused/' .env
          bash scripts/init.sh
      - run: docker compose up -d --build --wait postgres fetch-proxy miniflux x-webhook-rss
      - name: Verify internal feeds and the fetch proxy
        shell: bash
        run: |
          set -euo pipefail
          set -a; source .env; set +a
          b=http://127.0.0.1:8080/v1
          api() { curl -sS -u "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" -H 'Content-Type: application/json' "$@"; }
          json() { python3 -c "import json,sys; d=json.load(sys.stdin); print($1)"; }
          cat_id="$(api "$b/categories" | json 'd[0]["id"]')"
          feed=http://x-webhook-rss:8080/feeds/x/ci_user.xml

          echo "--- direct fetch of an internal feed is refused by Miniflux"
          code="$(api -o /tmp/direct.json -w '%{http_code}' -X POST "$b/feeds"             --data "{\"feed_url\":\"$feed\",\"category_id\":$cat_id}")"
          cat /tmp/direct.json; echo
          test "$code" -ge 400
          grep -q 'refusing to access private network host' /tmp/direct.json

          echo "--- the same feed works through the fetch proxy"
          id="$(api --fail-with-body -X POST "$b/feeds"             --data "{\"feed_url\":\"$feed\",\"category_id\":$cat_id,\"fetch_via_proxy\":true}" | json 'd["feed_id"]')"
          api --fail-with-body "$b/feeds/$id" | json 'd["parsing_error_count"] == 0 and d["fetch_via_proxy"]' | grep -qx True

          echo "--- the fetch proxy only relays allowed hosts"
          # wget -S は応答ヘッダを stderr に出す。拒否は tinyproxy の「403 Filtered」で確認する（タイムアウト等では通らない）
          via() { docker compose exec -T -e http_proxy=http://fetch-proxy:8888 x-webhook-rss wget -S -qO- -T 10 "$1" 2>&1; }
          via http://x-webhook-rss:8080/feeds/x/ci_user.xml | grep -q '<feed'
          for url in http://miniflux:8080/healthcheck http://postgres:5432/ http://example.com/ \
                     http://x-webhook-rss:8080/healthz http://x-webhook-rss:8080/status http://x-webhook-rss:9999/feeds/x/a.xml \
                     http://rss-bridge:8080/ http://x-webhook-rss.example.com:8080/feeds/x/a.xml; do
            out="$(via "$url" || true)"
            echo "$url -> $(echo "$out" | head -1)"
            echo "$out" | grep -q '403 Filtered' || { echo "expected the proxy to refuse $url"; exit 1; }
          done

          echo "--- internal-feeds.sh switches an internal feed back to the proxy"
          api --fail-with-body -X PUT "$b/feeds/$id" --data '{"fetch_via_proxy":false}' >/dev/null
          ./scripts/internal-feeds.sh | tee /tmp/internal.log   # update.sh と同じく直接実行（実行権限の確認を兼ねる）
          grep -q 'switched 1 feed(s)' /tmp/internal.log
          api --fail-with-body "$b/feeds/$id" | json 'd["fetch_via_proxy"]' | grep -qx True
          test ! -e .state/internal-feeds.failed
          ./scripts/internal-feeds.sh | grep -q 'switched 0 feed(s)'   # 冪等

          echo "--- a failure leaves a marker for monitor.sh"
          # load_env が .env の値を使うため、.env の API キーを一時的に不正な値にして失敗させる
          cp .env /tmp/env.ok
          sed -i 's|^MINIFLUX_API_KEY=.*|MINIFLUX_API_KEY=invalid-token|' .env
          if ./scripts/internal-feeds.sh; then echo "expected internal-feeds.sh to fail"; exit 1; fi
          test -s .state/internal-feeds.failed
          cp /tmp/env.ok .env
          ./scripts/internal-feeds.sh | grep -q 'switched 0 feed(s)'
          test ! -e .state/internal-feeds.failed   # 成功すると印は消える
      - if: failure()
        run: |
          docker compose ps -a
          docker compose logs postgres fetch-proxy miniflux x-webhook-rss

  service-image:
    # PR でも Dockerfile を amd64 / arm64（OCI A1）の両方でビルドし、起動して /healthz を確認する
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t x-webhook-rss:ci services/x-webhook-rss
      - run: docker build -t fetch-proxy:ci services/fetch-proxy
      - name: Smoke test
        run: |
          docker network create ftr
          # compose と同じサービス名で起動し、fetch-proxy から名前で届くようにする
          docker run -d --name x-webhook-rss --network ftr -p 18080:8080 \
            -e X_WEBHOOK_TOKEN="$(openssl rand -hex 32)" -e DB_PATH=/data/x.db x-webhook-rss:ci
          docker run -d --name fetch-proxy --network ftr -p 18888:8888 fetch-proxy:ci
          docker run --rm --entrypoint tinyproxy fetch-proxy:ci -v
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          proxied() { curl -sS -o /dev/null -w '%{http_code}' -x http://127.0.0.1:18888 "$1"; }
          test "$(proxied http://x-webhook-rss:8080/feeds/x/ci.xml)" = 200
          test "$(proxied http://x-webhook-rss:8080/healthz)" = 403
          test "$(proxied http://example.com/)" = 403
      - if: failure()
        run: docker logs x-webhook-rss; docker logs fetch-proxy

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning -x scripts/*.sh
      - name: init.sh generates secrets and reports missing values
        run: |
          tmp="$(mktemp -d)"
          mkdir "$tmp/scripts"
          cp .env.example "$tmp/" && cp scripts/init.sh "$tmp/scripts/"
          cd "$tmp"
          set +e; bash scripts/init.sh; code=$?; set -e
          test "$code" -eq 2                      # CLOUDFLARE_TUNNEL_TOKEN が未設定
          grep -qE '^X_WEBHOOK_TOKEN=[A-Za-z0-9]{48}$' .env
          grep -qE '^POSTGRES_PASSWORD=[A-Za-z0-9]{32}$' .env
          sed -i 's/^CLOUDFLARE_TUNNEL_TOKEN=CHANGE_ME$/CLOUDFLARE_TUNNEL_TOKEN=dummy/' .env
          bash scripts/init.sh

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose --profile cloudflare --profile x --profile morss --profile rsshub config --quiet

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Render cloud-init and check YAML / shell
        shell: bash
        run: |
          set -euo pipefail
          for au in true false; do
            echo "templatefile(\"templates/cloud-init.yaml.tftpl\", { env_file_b64 = base64encode(\"A=1\"), repo_url = \"https://github.com/x/freetier-reader.git\", repo_ref = \"main\", vcn_cidr = \"10.0.0.0/16\", data_mount = \"/srv/freetier-reader\", data_volume_gb = 50, auto_update = $au, healthcheck_ping_url = \"\" })" \
              | terraform console | sed -e '1{/^<<EOT$/d}' -e '${/^EOT$/d}' > "/tmp/cloud-init-$au.yaml"
          done
          python3 - <<'PY'
          import yaml
          for au in ("true", "false"):
              d = yaml.safe_load(open(f"/tmp/cloud-init-{au}.yaml"))
              assert d and d.get("write_files"), f"rendered cloud-init ({au}) is empty"
              paths = [f["path"] for f in d["write_files"]]
              assert "/etc/logrotate.d/freetier-reader" in paths, paths
              cron = next(f["content"] for f in d["write_files"] if f["path"] == "/etc/cron.d/freetier-reader")
              assert ("update.sh --auto" in cron) == (au == "true"), cron
              for f in d["write_files"]:
                  if f["path"].endswith(".sh"):
                      open(f"/tmp/{au}-" + f["path"].rsplit("/", 1)[1], "w").write(f["content"])
          PY
          shellcheck -S warning /tmp/true-*.sh /tmp/false-*.sh
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init && tflint --recursive

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
