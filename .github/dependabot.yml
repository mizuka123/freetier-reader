version: 2
updates:
  # GitHub Actions は 1 つの PR にまとめる
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # 注意: PostgreSQL のメジャー更新 PR はそのままマージしない（データ移行が必要）。
  # 手順: docs/operations.md「PostgreSQL のメジャーバージョンを上げる」
  # （セキュリティ修正の通知を止めないよう ignore は設定しない）
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # 注意: Node.js のメジャー更新 PR は LTS になってから CI の node-version と揃えてマージする
  - package-ecosystem: docker
    directory: /services/x-webhook-rss
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
